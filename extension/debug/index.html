<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOSS Observer Debug</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7fb;
        --panel: #ffffff;
        --border: #d8deea;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #1d4ed8;
        --good: #047857;
        --bad: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        background: rgba(246, 247, 251, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
        padding: 16px 20px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      main {
        padding: 20px;
        display: grid;
        gap: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
      }
      h2 {
        margin: 0 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--muted);
      }
      .kv {
        display: grid;
        gap: 8px;
      }
      .row {
        display: grid;
        grid-template-columns: 150px 1fr;
        gap: 8px;
        align-items: start;
      }
      .key {
        color: var(--muted);
        word-break: break-word;
      }
      .value {
        word-break: break-word;
        white-space: pre-wrap;
      }
      .status-good { color: var(--good); }
      .status-bad { color: var(--bad); }
      pre {
        margin: 0;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }
      li {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        background: #fafbff;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        padding: 8px 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: #b7c3d8;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>BOSS Observer Debug</h1>
      <div class="meta" id="updatedAt">Loading...</div>
    </header>
    <main>
      <div class="toolbar">
        <button id="refreshButton" type="button">Refresh</button>
      </div>

      <div class="grid">
        <section>
          <h2>Summary</h2>
          <div class="kv" id="summary"></div>
        </section>
        <section>
          <h2>Latest Event</h2>
          <pre id="lastEvent">No event yet.</pre>
        </section>
      </div>

      <section>
        <h2>Recent Events</h2>
        <ul id="recentEvents"></ul>
      </section>

      <section>
        <h2>Last Upload Error</h2>
        <pre id="lastUploadError">None.</pre>
      </section>

      <section>
        <h2>Last Upload Result</h2>
        <pre id="lastUploadResult">None.</pre>
      </section>

      <section>
        <h2>Raw State</h2>
        <pre id="rawState"></pre>
      </section>
    </main>
    <script type="module" src="./debug.js"></script>
  </body>
</html>
