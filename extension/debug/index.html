<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BOSS Observer 状态</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --line: #d9e0ea;
        --text: #1f2937;
        --muted: #6b7280;
        --ok: #047857;
        --ok-bg: #ecfdf5;
        --ok-line: #a7f3d0;
        --problem: #b91c1c;
        --problem-bg: #fff1f2;
        --problem-line: #fecdd3;
        --focus: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 390px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      h1 {
        margin: 0 0 3px;
        font-size: 17px;
        font-weight: 700;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      main {
        display: grid;
        gap: 10px;
        padding: 12px;
      }
      .toolbar {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 8px;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
        white-space: nowrap;
      }
      button:disabled {
        cursor: default;
        opacity: 0.65;
      }
      label {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      input {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #ffffff;
        color: var(--text);
        padding: 7px 9px;
        font: inherit;
      }
      input:focus {
        border-color: var(--focus);
        outline: 2px solid #bfdbfe;
      }
      .primary-action {
        border-color: #bfdbfe;
        background: #eff6ff;
        color: #1d4ed8;
      }
      section {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }
      h2 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .overall {
        border-radius: 8px;
        padding: 14px;
        font-size: 18px;
        font-weight: 800;
      }
      .overall.ok,
      .status-row.ok,
      .chat-row.ok {
        border: 1px solid var(--ok-line);
        background: var(--ok-bg);
        color: var(--ok);
      }
      .overall.problem,
      .status-row.problem,
      .chat-row.problem,
      .gate-status.problem {
        border: 1px solid var(--problem-line);
        background: var(--problem-bg);
        color: var(--problem);
      }
      .gate-status.ok {
        border: 1px solid var(--ok-line);
        background: var(--ok-bg);
        color: var(--ok);
      }
      .operator-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .operator-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      .operator-actions button {
        flex: 0 0 auto;
      }
      .save-status {
        min-width: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .gate-status {
        margin-top: 10px;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .status-list,
      .chat-list {
        display: grid;
        gap: 8px;
      }
      .status-row,
      .chat-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 700;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: currentColor;
      }
      .row-main {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .label {
        overflow-wrap: anywhere;
      }
      .state-text {
        flex: 0 0 auto;
      }
      .chat-row {
        justify-content: flex-start;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>BOSS Observer 状态</h1>
      <div class="meta">绿色表示正常，红色表示需要处理</div>
    </header>
    <main>
      <div class="toolbar">
        <button class="primary-action" id="downloadProfileButton" type="button">下载Profile</button>
        <button id="openDebugButton" type="button">打开Debug</button>
        <button id="refreshButton" type="button">刷新</button>
      </div>

      <section>
        <h2>账号配置</h2>
        <div class="operator-form">
          <label>
            操作员ID
            <input id="operatorIdInput" autocomplete="off" />
          </label>
          <label>
            账号姓名
            <input id="accountNameInput" autocomplete="off" />
          </label>
        </div>
        <div class="operator-actions">
          <button class="primary-action" id="saveOperatorButton" type="button">保存配置</button>
          <span class="save-status" id="operatorSaveStatus"></span>
        </div>
        <div class="gate-status problem" id="collectionGateStatus">采集已停止</div>
      </section>

      <section>
        <h2>整体状态</h2>
        <div class="overall ok" id="overallStatus">正常</div>
      </section>

      <section>
        <h2>数据状态</h2>
        <div class="status-list" id="moduleStatus"></div>
      </section>
    </main>
    <script type="module" src="./debug.js"></script>
  </body>
</html>
